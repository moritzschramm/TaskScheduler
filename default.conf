server {
    listen 80 default_server;
    root /var/www/html/public;

	index index.html index.htm;

	server_name _;

	charset utf-8;

	location /api {
	    proxy_set_header X-Csrf 1;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_pass http://api:3000/api;
	    access_log off;
	}

	location / {
	    proxy_pass http://frontend:5173/;
	    access_log off;
	}

	location ~ /\.ht {
	   deny all;
	}
}
