# ! PRODUCTION COMPOSE FILE

services:
  ####### APP SERVICES
  revproxy:
    container_name: ts.prod.revproxy
    image: nginx:1.25
    restart: unless-stopped
    networks:
      - skynet
    volumes:
      - ./docker/nginx/prod/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/var/www/html/public:ro
    ports:
      - "8000:80"
      - "443:443"
    depends_on:
      - frontend
      - api-prod

  frontend:
    container_name: ts.prod.frontend
    build:
      context: .
      dockerfile: ./docker/node/prod.Dockerfile
    volumes:
      - ./docker/dist:/usr/src/app/dist
      - ignore_in_filesystem:/usr/src/app/node_modules
      - ./docker/prod/.env:/usr/src/app/.env:ro

  api-prod:
    container_name: ts.prod.api
    pid: "host"
    build:
      context: .
      dockerfile: ./docker/go/prod.Dockerfile
    volumes:
      - ./docker/prod/.env:/.env:ro
    ports:
      - "3000:3000"
    networks:
      - skynet
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started

  ###### DATABASE MIGRATIONS
  pgroll: # database migrations
    container_name: ts.pgroll
    image: taskscheduler/pgroll:1.0
    tty: true
    build:
      context: .
      dockerfile: ./docker/pgroll/Dockerfile
    networks:
      - skynet
    depends_on:
      postgres:
        condition: service_healthy
        restart: true

  ###### STORAGE SERVICES
  postgres:
    container_name: ts.prod.postgres
    image: postgres:16
    networks:
      - skynet
    env_file: ./docker/prod/.env
    volumes:
      - ./docker/prod/database/internal/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  redis:
    container_name: ts.prod.redis
    image: redis:7
    networks:
      - skynet

networks:
  skynet:
    driver: bridge

volumes:
  ignore_in_filesystem:
