# ! ONLY FOR DEV; NOT FOR PRODUCTION

services:
  revproxy:
    image: nginx:1.25
    restart: unless-stopped
    networks:
      - skynet
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    depends_on:
      - frontend
      - api
  frontend:
    image: node:21
    stop_signal: SIGKILL
    networks:
      - skynet
    ports:
      - "5173:5173"
    working_dir: /usr/src/app
    volumes:
      - ./client:/usr/src/app
      - .env:/usr/src/app/.env
    command: bash -c "npm i && npm run docker-dev"
    depends_on:
      - api
  api:
    image: golang:1.22
    networks:
      - skynet
    working_dir: /usr/src/app
    volumes:
      - ./server:/usr/src/app
      - .env:/usr/src/app/.env
    command: bash -c "go install github.com/mitranim/gow@latest && go mod download && gow -v run ."
    depends_on:
      - db
      - redis
  db:
    image: postgres:16
    networks:
      - skynet
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./database/data:/var/lib/postgresql/data
  redis:
    image: redis:7
    networks:
      - skynet
    ports:
      - "6379:6379"

networks:
  skynet:
    driver: bridge

volumes:
  data:
    driver: local
