# Development stack. `docker compose up --build` then open http://localhost:8080
#
# nginx is the only exposed port: it fronts the Vite dev server and the API so
# the browser sees one origin, matching production.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ambitime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ambitime}
      POSTGRES_DB: ${POSTGRES_DB:-ambitime}
    ports:
      # Exposed so tests and drizzle-kit can run from the host.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # The database lives in the checkout rather than in a Docker-managed
      # volume, so it is somewhere a person can find: `du -sh data/` says what
      # it costs, `rm -rf data/` is the reset, and deleting the clone takes the
      # data with it instead of leaving an orphan volume behind. Gitignored,
      # for the obvious reason.
      #
      # Postgres 18+ expects a single mount at the parent directory; it
      # places version-specific data in a subdirectory for pg_upgrade.
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ambitime} -d ${POSTGRES_DB:-ambitime}']
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: docker/node/dev.Dockerfile
    command: sh -c "/usr/local/bin/server-entrypoint.sh pnpm --filter @ambitime/server dev"
    environment:
      NODE_ENV: development
      SERVER_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-ambitime}:${POSTGRES_PASSWORD:-ambitime}@postgres:5432/${POSTGRES_DB:-ambitime}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
    volumes:
      - .:/app
      # Keep container-installed node_modules; the host's are for the host.
      - /app/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/scheduler/node_modules
      - /app/packages/server/node_modules
      - /app/packages/client/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    # nginx resolves its upstreams once, at start. Without this it comes up
    # first, caches "no such host", and serves 502 until somebody restarts it —
    # which looks exactly like a broken build to whoever just cloned the repo.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  client:
    build:
      context: .
      dockerfile: docker/node/dev.Dockerfile
    command: pnpm --filter @ambitime/client dev --host 0.0.0.0
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/scheduler/node_modules
      - /app/packages/server/node_modules
      - /app/packages/client/node_modules
    depends_on:
      - server
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  nginx:
    image: nginx:1.29-alpine
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./docker/nginx/dev/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
