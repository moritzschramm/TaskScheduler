# Production: nginx serves the built client bundle directly and proxies the API.
# §14 says no sensitive data in URLs, and nothing here puts any there — but a
# proxy in front may add its own, so `$uri` is logged rather than `$request`,
# which would carry the query string. `log_format` is only valid in the `http`
# context, and a conf.d file is included into it — hence out here, not in the
# server block below.
log_format ambitime '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

upstream ambitime_server {
    server server:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;

    # NOTE: `add_header` does not merge across levels — a location block that
    # sets any header of its own discards every inherited one. `/assets/` sets
    # `Cache-Control`, and so was serving the whole JavaScript bundle with none
    # of the headers below. Hence the repetition further down: nginx gives no
    # way to add to an inherited set, only to replace it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Spec §14. Everything is same-origin: the bundle, the API behind /api/, and
    # the fonts. Nothing is embedded and nothing embeds us.
    #
    # `style-src` allows inline because Vue writes `style` attributes for
    # anything it positions — the calendar grid computes every block's height —
    # and that is a style attribute rather than a script. `script-src` is
    # strict, which is the half that matters: the production bundle is emitted
    # as module files with no inline script and no `eval`.
    #
    # `frame-ancestors` is what actually stops framing in a current browser;
    # `X-Frame-Options` above is kept for the ones that predate it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    access_log /var/log/nginx/access.log ambitime;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ambitime_server;
        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed asset filenames; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Repeated because this block's own `add_header` above discarded the
        # server-level set. Without these the bundle — the one response an
        # attacker would most like to have sniffed as another type — went out
        # bare.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
