# Dev reverse proxy: one origin on :80 in front of the Vite dev server and the
# Hono API, so the browser never deals with cross-origin requests or a second port.
upstream ambitime_client {
    server client:5173;
}

upstream ambitime_server {
    server server:3000;
}

server {
    listen 80;
    server_name _;

    # NOTE: proxy_set_header does not merge across levels — a location block that
    # sets any header discards every inherited one. Hence the full set in each.

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ambitime_server;
        proxy_read_timeout 60s;
    }

    # Everything else is the client, including Vite's HMR websocket.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://ambitime_client;
        proxy_read_timeout 86400s;
    }
}
