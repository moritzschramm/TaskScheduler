name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Integration tests hit a real Postgres — /health proves the query path, so
  # there is nothing meaningful to assert against a fake.
  TEST_DATABASE_URL: postgres://ambitime:ambitime@localhost:5432/ambitime

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ambitime
          POSTGRES_PASSWORD: ambitime
          POSTGRES_DB: ambitime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ambitime -d ambitime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build production images
        run: |
          docker build -f docker/node/prod.Dockerfile --target server -t ambitime-server:ci .
          docker build -f docker/node/prod.Dockerfile --target client -t ambitime-client:ci .
